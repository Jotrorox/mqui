[package]
name = "mqui"
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/jotrorox/mqui"

[dependencies]
eframe = "0.35.0"
egui = "0.35.0"
mqtt-endpoint-tokio = "0.6.5"
mimalloc = { version = "0.1.52", features = ["secure"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util = "0.7.16"
directories = "6"
rfd = "0.17.2"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
# Must match mqtt-endpoint-tokio's public WebSocket transport types.
tokio-tungstenite = "0.20.1"
toml = "1.1.3"
url = "2.5.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[profile.dist]
inherits = "release"
lto = "thin"
