name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libgtk-3-dev libudev-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Start Mosquitto integration broker
        run: docker compose -f test-broker/docker-compose.yml up --detach --wait
      - name: Run all tests
        env:
          MQUI_INTEGRATION_TESTS: "1"
        run: cargo test --all-targets
      - name: Show broker logs
        if: failure()
        run: docker compose -f test-broker/docker-compose.yml logs --no-color
      - name: Stop Mosquitto integration broker
        if: always()
        run: docker compose -f test-broker/docker-compose.yml down --volumes

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libgtk-3-dev libudev-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets
        run: cargo check --all-targets --all-features

